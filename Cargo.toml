[package]
name = "omarchy-metronome"
version = "0.1.0"
edition = "2021"
description = "A metronome for Omarchy: Rust backend, Quickshell/QML frontend, follows the Omarchy theme"
rust-version = "1.89"
license = "MIT"
authors = ["Douglas Moura <doug@douglasmoura.com>"]
repository = "https://github.com/DouglasdeMoura/omarchy-metronome"
homepage = "https://github.com/DouglasdeMoura/omarchy-metronome"
readme = "README.md"
keywords = ["metronome", "omarchy", "quickshell", "music", "audio"]
categories = ["multimedia::audio"]

[dependencies]
# The one dependency, and the only one Metronome will ever need beyond std: a
# metronome is audio first, and cpal is what puts the click at an exact sample
# position on the output device instead of at the mercy of thread scheduling.
# Everything else — JSON, the protocol, the timeline — is std-only, the same
# discipline Flea's backend keeps.
cpal = "0.15"

[profile.release]
opt-level = 3
lto = true
strip = true
